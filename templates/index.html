<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homeopathic Clinic</title>
</head>
<body>
  <h1>Welcome to Our Homeopathic Clinic</h1>
  <p>First 3 consultations are free!</p>

  <h2>Book a Consultation</h2>
  <!-- This form sends data to the Python backend -->
  <form action="http://127.0.0.1:5000/submit" method="POST">
    <input type="text" name="name" placeholder="Your Name" required><br><br>
    <input type="email" name="email" placeholder="Your Email" required><br><br>
    <textarea name="message" placeholder="Your Message"></textarea><br><br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
